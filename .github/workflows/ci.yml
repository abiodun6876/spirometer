name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Type-check & build ───────────────────────────────────────────────────────
  build:
    name: Build & type-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check frontend
        run: npx tsc -b --noEmit

      - name: Type-check Netlify functions
        run: npm run build:functions

      - name: Build frontend
        # Provide placeholder env vars so the config validator doesn't throw
        env:
          VITE_FIREBASE_API_KEY:            placeholder
          VITE_FIREBASE_AUTH_DOMAIN:        placeholder.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID:         placeholder
          VITE_FIREBASE_STORAGE_BUCKET:     placeholder.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          VITE_FIREBASE_APP_ID:             1:000000000000:web:000000000000
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ── Lint ──────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run oxlint
        run: npm run lint
